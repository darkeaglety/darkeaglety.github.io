<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b4a"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a060"/>
      <stop offset="1" stop-color="#a8673a"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#fff6c0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff6c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <rect width="400" height="200" fill="url(#spot)"/>
  <rect y="200" width="400" height="60" fill="url(#floor)"/>
  <!-- hoop -->
  <rect x="352" y="60" width="8" height="60" fill="#eee"/>
  <rect x="340" y="40" width="6" height="70" fill="#fff" opacity="0.9"/>
  <rect x="300" y="96" width="42" height="5" rx="2" fill="#ff6b35"/>
  <path d="M302 101 L310 128 L332 128 L340 101" fill="none" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <!-- ball -->
  <circle cx="250" cy="70" r="15" fill="#ff8c2a" stroke="#5a2a00" stroke-width="2"/>
  <path d="M235 70 H265 M250 55 V85" stroke="#5a2a00" stroke-width="2"/>
  <path d="M225 120 Q235 95 240 85" stroke="#ffe66d" stroke-width="3" stroke-dasharray="4 6" fill="none"/>
  <!-- stickman 1 (coral) -->
  <g stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="200" cy="112" r="12" fill="#1a1a2e"/>
    <path d="M200 124 L196 165"/>
    <path d="M198 132 L218 112 L228 96"/>
    <path d="M198 134 L180 150"/>
    <path d="M196 165 L182 190 L176 200"/>
    <path d="M196 165 L210 186 L214 200"/>
  </g>
  <!-- stickman 2 (teal) -->
  <g stroke="#4ecdc4" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="120" cy="132" r="12" fill="#1a1a2e"/>
    <path d="M120 144 L124 182"/>
    <path d="M122 152 L146 130 L156 112"/>
    <path d="M122 154 L100 168"/>
    <path d="M124 182 L112 200"/>
    <path d="M124 182 L138 200"/>
  </g>
  <text x="200" y="240" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="30" font-weight="900" fill="#ffe66d" stroke="#1a1a2e" stroke-width="2">WACKY BASKET</text>
</svg>
